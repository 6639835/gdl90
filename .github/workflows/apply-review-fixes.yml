name: Apply review fixes

on:
  push:
    branches: [fix/production-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply review fixes
        run: python scripts/apply_review_fixes.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - name: Verify MSRV
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --all-targets
      - name: Commit verified changes
        run: |
          rm -f scripts/apply_review_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate cadence profiles and declare the MSRV"
          git push origin HEAD:fix/production-hardening
