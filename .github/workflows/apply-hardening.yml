name: Apply production hardening

on:
  push:
    branches: [fix/production-hardening]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply audited patches
        run: |
          python scripts/hardening/patch_core.py
          python scripts/hardening/patch_protocol.py
          python scripts/hardening/patch_compile_fix.py
          python scripts/hardening/patch_docs.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - name: Commit verified patch
        run: |
          rm -rf scripts/hardening
          rm -f .github/workflows/apply-hardening.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden protocol handling for production inputs"
          git push origin HEAD:fix/production-hardening
