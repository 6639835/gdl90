name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-audit --locked --version 0.22.2
      - name: Audit production and fuzz dependencies against current RustSec data
        run: |
          cargo +stable audit --deny warnings
          cargo +stable audit --file fuzz/Cargo.lock --deny warnings
