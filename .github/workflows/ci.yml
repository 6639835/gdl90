name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Formatting and static analysis
        run: |
          cargo +1.88.0 fmt --all -- --check
          cargo +1.88.0 fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.88.0 check --locked --manifest-path fuzz/Cargo.toml --all-targets
      - name: Documentation and distributable package
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.88.0 doc --locked --no-deps --all-features
          cargo +1.88.0 test --locked --doc
          cargo +1.88.0 package --locked
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-24.04
            rust: 1.88.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: cargo +${{ matrix.rust }} test --locked --all-targets --all-features
      - run: cargo +${{ matrix.rust }} test --locked --release --all-targets --all-features
