name: Dependency audit evidence
on:
  push:
    branches: ['audit/production-readiness-2026-09-07']
    paths: ['.github/workflows/audit-evidence.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: adacbbba29e6d6ce4e1ea711a51218b1b872e5ea
          persist-credentials: false
      - name: Install audit tooling
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-audit --locked
          mkdir -p evidence
          rustc -Vv > evidence/toolchain.txt
          cargo audit --version > evidence/audit-version.txt
          cargo search cargo-fuzz --limit 1 > evidence/fuzz-version.txt
      - name: Audit original and updated lockfiles
        shell: bash
        run: |
          cp Cargo.lock evidence/before.lock
          cargo audit --json > evidence/before-audit.json
          cargo update
          cargo update --manifest-path fuzz/Cargo.toml
          cargo audit --json > evidence/after-audit.json
          cargo audit --file fuzz/Cargo.lock --json > evidence/fuzz-audit.json
          git -C "$HOME/.cargo/advisory-db" rev-parse HEAD > evidence/advisory-db-commit.txt
          cargo metadata --locked --format-version 1 > evidence/dependencies.json
          cargo test --locked --all-targets > evidence/dependency-update-tests.log 2>&1
          cargo vendor --locked --versioned-dirs --sync fuzz/Cargo.toml offline/vendor > evidence/vendor-config.toml
          cp Cargo.lock evidence/after.lock
          cp fuzz/Cargo.lock evidence/fuzz.lock
          tar -C offline -czf evidence/vendor.tar.gz vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error
