name: Production audit evidence

on:
  push:
    branches: ['audit/production-readiness-2026-09-07']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 942a06a375678f06679d0bba5dc843fb4156c95d
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: adacbbba29e6d6ce4e1ea711a51218b1b872e5ea
          path: candidate
          persist-credentials: false
      - name: Install the existing hardening branch's declared MSRV
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Verify both immutable source revisions
        shell: bash
        run: |
          mkdir -p evidence
          rustc +1.88.0 -Vv > evidence/toolchain.txt
          set +e
          status=0
          for source in baseline candidate; do
            git -C "$source" rev-parse HEAD > "evidence/$source.commit"
            (cd "$source" && cargo +1.88.0 test --locked --all-targets) > "evidence/$source.tests.log" 2>&1
            result=$?; echo "$result" > "evidence/$source.tests.status"; status=$((status | result))
            (cd "$source" && cargo +1.88.0 fmt --all -- --check) > "evidence/$source.fmt.log" 2>&1
            result=$?; echo "$result" > "evidence/$source.fmt.status"; status=$((status | result))
            (cd "$source" && cargo +1.88.0 clippy --locked --all-targets -- -D warnings) > "evidence/$source.clippy.log" 2>&1
            result=$?; echo "$result" > "evidence/$source.clippy.status"; status=$((status | result))
            git -C "$source" archive HEAD | gzip > "evidence/$source.tar.gz"
          done
          echo "$status" > evidence/exit-status
      - name: Prepare an offline audit environment
        shell: bash
        run: |
          mkdir -p offline
          cd baseline
          cargo +1.88.0 vendor --locked --sync ../candidate/Cargo.toml ../offline/vendor > ../offline/config.toml
          cd ..
          cp -a "$(rustc +1.88.0 --print sysroot)" offline/rust
          rm -rf offline/rust/share/doc
          tar -C offline -czf offline-audit-environment.tar.gz .
      - name: Retain verification evidence and exact source snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-source-and-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Retain temporary offline build tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-offline-build-environment
          path: offline-audit-environment.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Check verification outcomes
        run: test "$(cat evidence/exit-status)" = 0
