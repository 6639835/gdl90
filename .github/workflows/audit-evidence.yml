name: Publish verified audit source
on:
  push:
    branches: ['audit/production-readiness-2026-09-07']
    paths: ['.github/workflows/audit-evidence.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == '6639835/gdl90' && github.ref == 'refs/heads/audit/production-readiness-2026-09-07'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and prepare the reviewed source without executing project code
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path(f'.audit/patch-{n}.b64').read_text().strip() for n in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '73366e0b51b199daa72e00cf42165431fc7f9f42c3b77e71354a775b196ef538'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'implementation.patch').write_bytes(patch)
          PY
          cp -a .github/workflows "$RUNNER_TEMP/workflows"
          git fetch origin adacbbba29e6d6ce4e1ea711a51218b1b872e5ea
          git read-tree --reset -u adacbbba29e6d6ce4e1ea711a51218b1b872e5ea
          rm -rf .github/workflows
          cp -a "$RUNNER_TEMP/workflows" .github/workflows
          git apply --unidiff-zero --check "$RUNNER_TEMP/implementation.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/implementation.patch"
          git add -A
          git diff --cached --exit-code HEAD -- .github/workflows
          manifest=$(git ls-files --stage -z -- . ':(exclude).github/workflows/**' ':(exclude).audit/**' | sha256sum | cut -d' ' -f1)
          test "$manifest" = d2fd2341f7890d17197bfc2c117641756c03be0713f5d8ba501d8dbb844758d3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete production hardening, recovery and performance audit' -m 'Incorporates the reviewed PR #3 source at adacbbba29e6d6ce4e1ea711a51218b1b872e5ea and the independently validated September 7 audit fixes. Source manifest verified before publishing. No project or dependency code runs in this write-permission job.'
      - name: Publish only the audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/audit/production-readiness-2026-09-07
          git rev-parse HEAD
