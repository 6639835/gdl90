name: Finalize production hardening

on:
  push:
    branches: [fix/production-hardening]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply final edge-case fixes
        run: |
          python scripts/finalize_hardening.py
          python scripts/finalize_test_fix.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - name: Commit verified changes
        run: |
          rm -f scripts/finalize_hardening.py scripts/finalize_test_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close remaining protocol edge cases"
          git push origin HEAD:fix/production-hardening
